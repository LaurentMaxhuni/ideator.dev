<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ideator.dev Logo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 80px;
            background: #0a0a0a;
            font-family: 'Outfit', sans-serif;
        }

        .logo-container {
            display: flex;
            align-items: baseline;
            gap: 0;
        }

        .logo-text {
            font-size: 72px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -2px;
        }

        .logo-dot {
            position: relative;
            display: inline-block;
            width: 18px;
            height: 18px;
            margin-left: 2px;
            margin-bottom: 8px;
        }

        .dot-core {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 12px;
            height: 12px;
            background: linear-gradient(135deg, #ffd700 0%, #ffb700 50%, #ff8c00 100%);
            border-radius: 50%;
            z-index: 2;
        }

        .dot-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 12px;
            height: 12px;
            background: radial-gradient(circle, #ffd700 0%, transparent 70%);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
            z-index: 1;
        }

        .dot-shine {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.4) 0%, transparent 60%);
            border-radius: 50%;
            animation: shine 3s ease-in-out infinite;
            z-index: 0;
        }

        .dot-rays {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.15) 0%, transparent 50%);
            border-radius: 50%;
            animation: rays 4s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes pulse {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.8;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.3);
                opacity: 1;
            }
        }

        @keyframes shine {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.6;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.2);
                opacity: 0.9;
            }
        }

        @keyframes rays {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.4;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.15);
                opacity: 0.7;
            }
        }

        /* Variations */
        .variation-label {
            color: #555;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }

        .light-bg {
            background: #f5f5f5;
            padding: 60px 80px;
            border-radius: 12px;
        }

        .light-bg .logo-text {
            color: #1a1a1a;
        }

        .compact .logo-text {
            font-size: 48px;
        }

        .compact .dot-core {
            width: 10px;
            height: 10px;
        }

        .compact .dot-glow {
            width: 10px;
            height: 10px;
        }

        .compact .dot-shine {
            width: 30px;
            height: 30px;
        }

        .compact .dot-rays {
            width: 45px;
            height: 45px;
        }

        .minimal .dot-shine,
        .minimal .dot-rays {
            display: none;
        }

        .minimal .dot-glow {
            animation: pulse 3s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div>
        <div class="variation-label">Default</div>
        <div class="logo-container">
            <span class="logo-text">ideator</span>
            <span class="logo-dot">
                <span class="dot-rays"></span>
                <span class="dot-shine"></span>
                <span class="dot-glow"></span>
                <span class="dot-core"></span>
            </span>
            <span class="logo-text">dev</span>
        </div>
    </div>

    <div>
        <div class="variation-label">Light Background</div>
        <div class="logo-container light-bg">
            <span class="logo-text">ideator</span>
            <span class="logo-dot">
                <span class="dot-rays"></span>
                <span class="dot-shine"></span>
                <span class="dot-glow"></span>
                <span class="dot-core"></span>
            </span>
            <span class="logo-text">dev</span>
        </div>
    </div>

    <div>
        <div class="variation-label">Compact</div>
        <div class="logo-container compact">
            <span class="logo-text">ideator</span>
            <span class="logo-dot">
                <span class="dot-rays"></span>
                <span class="dot-shine"></span>
                <span class="dot-glow"></span>
                <span class="dot-core"></span>
            </span>
            <span class="logo-text">dev</span>
        </div>
    </div>

    <div>
        <div class="variation-label">Minimal</div>
        <div class="logo-container minimal">
            <span class="logo-text">ideator</span>
            <span class="logo-dot">
                <span class="dot-glow"></span>
                <span class="dot-core"></span>
            </span>
            <span class="logo-text">dev</span>
        </div>
    </div>
</body>
</html>
